<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Delys 010 - Hindi Typing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Delys 010 - हिंदी टाइपिंग</h1>
        <div class="stats">
            <div>समय: <span id="time">60</span>s</div>
            <div>स्पीड: <span id="wpm">0</span> WPM</div>
            <div>सटीकता: <span id="accuracy">100</span>%</div>
        </div>
        <div class="typing-box"><p id="original-text">लोड हो रहा है...</p></div>
        <textarea id="typing-input" disabled placeholder="यहाँ टाइप करें..."></textarea>
        <button id="start-btn" onclick="startTest()">टेस्ट शुरू करें</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
